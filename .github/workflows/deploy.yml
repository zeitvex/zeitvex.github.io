name: deploy-to-1panel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-to-1panel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n')"
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SITE_ROOT: ${{ secrets.SITE_ROOT }}
        run: |
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '\r\n')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n')"
          SITE_ROOT="$(printf '%s' "$SITE_ROOT" | tr -d '\r\n')"

          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SITE_ROOT"
          test "$SITE_ROOT" != "/"

          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tools/' \
            --exclude='.well-known/' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "$SSH_USER@$SSH_HOST:$SITE_ROOT/"
